<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bikini Bottom Jeopardy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --deep:#041a36;--ocean:#0a3d6b;--sea:#0f5d93;--tile:#0b2fa8;--tile2:#0a2590;
  --gold:#ffd23f;--sponge:#ffe14d;--pink:#ff8fb1;--teal:#3fd6d1;--coral:#ff7a45;
  --ink:#06213f;--white:#f4fbff;--muted:#9fc3e0;--good:#3ee08f;--bad:#ff5a6e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--white);
  background:radial-gradient(ellipse at 50% -10%,#1d7fc0 0%,var(--ocean) 35%,var(--deep) 100%) fixed;
  overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:0}
input{font-family:inherit}
.display{font-family:'Titan One',Nunito,sans-serif;letter-spacing:.5px}

/* bubbles */
#bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bub{position:absolute;bottom:-60px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.55),rgba(255,255,255,.08) 45%,rgba(255,255,255,.02) 70%);
  border:1px solid rgba(255,255,255,.25);animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0)}50%{transform:translate(18px,-55vh)}100%{transform:translate(-10px,-115vh)}}
.sand{position:fixed;left:0;right:0;bottom:0;height:70px;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(238,206,140,.18) 60%,rgba(238,206,140,.28))}

#app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px}
.logo{display:flex;align-items:baseline;gap:10px}
.logo .a{font-size:30px;color:var(--sponge);text-shadow:0 3px 0 #b8860b,0 6px 14px rgba(0,0,0,.4)}
.logo .b{font-size:30px;color:var(--white);text-shadow:0 3px 0 #0a2590,0 6px 14px rgba(0,0,0,.4)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--sponge);color:var(--ink);font-weight:900;padding:12px 20px;border-radius:14px;
  box-shadow:0 4px 0 #b8960b;font-size:16px;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b8960b}
.btn.ghost{background:rgba(255,255,255,.1);color:var(--white);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.btn.pink{background:var(--pink);box-shadow:0 4px 0 #c2557a}
.btn.teal{background:var(--teal);box-shadow:0 4px 0 #1f8f8b}
.btn.big{font-size:22px;padding:16px 30px;border-radius:18px}
.btn.sm{font-size:13px;padding:8px 12px;border-radius:10px;box-shadow:0 3px 0 #b8960b}
.btn.ghost.sm{box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.btn:disabled{opacity:.4;cursor:default}

/* board */
.boardwrap{flex:1;display:flex;flex-direction:column;padding:0 24px 16px;gap:14px}
.board{flex:1;display:grid;grid-template-columns:repeat(var(--cols,6),1fr);grid-template-rows:auto repeat(5,1fr);gap:8px;
  background:#020c1c;padding:8px;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 0 0 3px #12306b;min-height:480px}
.cat{background:linear-gradient(180deg,var(--tile),var(--tile2));display:flex;align-items:center;justify-content:center;
  text-align:center;padding:12px 8px;border-radius:8px;font-size:clamp(13px,1.45vw,20px);text-transform:uppercase;
  color:var(--white);text-shadow:0 2px 0 #000;min-height:84px;line-height:1.15}
.tilebtn{background:linear-gradient(180deg,#1238c4,var(--tile2));border-radius:8px;color:var(--gold);
  font-size:clamp(22px,3vw,46px);text-shadow:0 3px 0 #000,0 0 18px rgba(255,210,63,.25);
  display:flex;align-items:center;justify-content:center;transition:transform .12s,filter .12s;position:relative}
.tilebtn:hover{transform:scale(1.03);filter:brightness(1.18);z-index:2}
.tilebtn.used{background:#0a1a4a;color:transparent;text-shadow:none;cursor:default;transform:none;filter:none}
.tilebtn.used::after{content:'';position:absolute;inset:38% 40%;border-radius:50%;border:2px solid rgba(255,255,255,.08)}

/* scoreboard */
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.pcard{background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border-radius:16px;padding:12px 16px;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.12);display:flex;align-items:center;justify-content:space-between;gap:10px}
.pcard .nm{font-weight:900;font-size:20px;display:flex;align-items:center;gap:8px}
.pcard .sc{font-family:'Titan One';font-size:28px;color:var(--gold)}
.pcard .sc.neg{color:var(--bad)}
.dot{width:10px;height:10px;border-radius:50%;background:#4a6a8a;display:inline-block}
.dot.on{background:var(--good);box-shadow:0 0 10px var(--good)}
.pcard.lead{box-shadow:inset 0 0 0 3px var(--gold)}

/* clue */
.cluescreen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 40px 30px;gap:24px;text-align:center}
.cluemeta{display:flex;gap:12px;align-items:center;font-weight:900;font-size:20px;text-transform:uppercase;color:var(--muted)}
.cluemeta .val{color:var(--gold);font-family:'Titan One';font-size:26px}
.cluetext{font-family:'Titan One';font-size:clamp(28px,3.6vw,58px);line-height:1.18;max-width:1200px;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.picframe{width:min(900px,92vw);aspect-ratio:16/9;max-height:46vh;border-radius:20px;overflow:hidden;background:#020c1c;
  box-shadow:0 0 0 6px var(--sponge),0 18px 40px rgba(0,0,0,.5);position:relative}
.picframe img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s linear;transform-origin:var(--ox,50%) var(--oy,50%)}
.picmissing{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-weight:800;padding:20px}
.picmissing b{font-family:'Titan One';color:var(--sponge);font-size:28px}
.cluescreen.pic{gap:16px;padding-top:6px}
.cluescreen.pic .cluetext{font-size:clamp(26px,2.8vw,44px)}
.cluescreen.pic .opt{padding:12px 18px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:0 24px 30px}
.pcard2{background:rgba(255,255,255,.07);border-radius:16px;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.1);display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .15s}
.pcard2.sel{box-shadow:inset 0 0 0 3px var(--sponge),0 0 0 3px rgba(255,225,77,.25)}
.pcard2.drag{box-shadow:inset 0 0 0 3px var(--teal)}
.pthumb{aspect-ratio:16/9;background:#041327;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:800;font-size:13px;text-align:center;padding:8px;border-bottom:2px dashed rgba(255,255,255,.12)}
.pthumb img{width:100%;height:100%;object-fit:cover}
.pinfo{padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pinfo .nm{font-weight:900;font-size:16px;line-height:1.2}
.pinfo .meta{font-size:12px;font-weight:800;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pinfo a{color:var(--teal);font-weight:800;font-size:13px}
.pbtns{display:flex;gap:6px}
.tag{padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.1)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:1100px}
.opt{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:18px;font-weight:900;font-size:clamp(18px,1.9vw,28px);
  color:var(--ink);text-align:left;transition:opacity .3s,transform .3s}
.opt .L{font-family:'Titan One';background:rgba(0,0,0,.15);border-radius:12px;width:48px;height:48px;flex:none;display:flex;align-items:center;justify-content:center;font-size:26px}
.o0{background:var(--sponge);box-shadow:0 5px 0 #b8960b}.o1{background:var(--pink);box-shadow:0 5px 0 #c2557a}
.o2{background:var(--teal);box-shadow:0 5px 0 #1f8f8b}.o3{background:var(--coral);box-shadow:0 5px 0 #b8501f}
.opt.dim{opacity:.22;transform:scale(.97)}
.opt.win{transform:scale(1.04);outline:5px solid #fff;outline-offset:3px}
.timer{width:100%;max-width:1100px;height:14px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
.timer i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--sponge),var(--coral));border-radius:99px;transition:width .25s linear}
.timenum{font-family:'Titan One';font-size:34px;color:var(--sponge);min-width:60px}
.locks{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lock{padding:10px 18px;border-radius:99px;font-weight:900;font-size:18px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);
  display:flex;align-items:center;gap:8px;color:var(--white);transition:all .2s}
.lock.in{background:var(--white);color:var(--ink)}
.lock.right{background:var(--good);color:var(--ink);box-shadow:none}
.lock.wrong{background:var(--bad);color:#fff;box-shadow:none}
button.lock:hover{filter:brightness(1.1)}
.hint{color:var(--muted);font-weight:700;font-size:15px}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}

/* daily double */
.dd{font-family:'Titan One';font-size:clamp(60px,10vw,150px);line-height:.95;color:var(--gold);
  text-shadow:0 6px 0 #b8860b,0 14px 40px rgba(0,0,0,.5);animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}

/* lobby */
.lobby{flex:1;display:grid;grid-template-columns:1.1fr 1fr;gap:24px;padding:10px 24px 30px;align-items:start;max-width:1300px;margin:0 auto;width:100%}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.04));border-radius:22px;padding:24px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.1)}
.panel h2{font-family:'Titan One';font-size:26px;margin-bottom:6px;color:var(--sponge)}
.panel p{color:var(--muted);font-weight:700;margin-bottom:16px;line-height:1.45}
.pl-row{display:flex;gap:8px;margin-bottom:10px;align-items:center}
.pl-row input{flex:1;font-size:20px;font-weight:800;padding:12px 14px;border-radius:12px;border:0;background:rgba(255,255,255,.95);color:var(--ink)}
.x{background:rgba(255,255,255,.1);color:#fff;width:44px;height:48px;border-radius:12px;font-size:20px;font-weight:900}
.qrbox{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
#qr{background:#fff;padding:12px;border-radius:16px;width:244px;height:244px;display:flex;align-items:center;justify-content:center;flex:none}
#qr img,#qr canvas{display:block}
.urlbox{font-size:12px;word-break:break-all;color:var(--muted);background:rgba(0,0,0,.25);padding:8px 10px;border-radius:10px;margin-top:10px}
.joined{display:flex;flex-direction:column;gap:8px;min-width:170px}
.jrow{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
.settings{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800}
.seg{display:flex;background:rgba(0,0,0,.25);border-radius:12px;padding:4px;gap:4px}
.seg button{background:transparent;color:var(--white);font-weight:900;padding:8px 12px;border-radius:9px}
.seg button.on{background:var(--sponge);color:var(--ink)}
.status{font-size:13px;font-weight:800;padding:6px 10px;border-radius:99px;background:rgba(0,0,0,.25);display:inline-flex;gap:6px;align-items:center}

/* final */
.wagers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;width:100%;max-width:1000px}
.wcard{background:rgba(255,255,255,.08);border-radius:16px;padding:16px;text-align:left;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
.wcard .nm{font-weight:900;font-size:20px;display:flex;justify-content:space-between;align-items:center}
.wcard input{width:100%;margin-top:10px;font-size:22px;font-weight:900;padding:10px 12px;border-radius:12px;border:0;color:var(--ink)}
.wcard small{color:var(--muted);font-weight:700}
.podium{display:flex;gap:18px;align-items:flex-end;justify-content:center;margin-top:10px}
.pod{width:200px;border-radius:18px 18px 6px 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:16px 10px;color:var(--ink)}
.pod .nm{font-weight:900;font-size:22px}.pod .sc{font-family:'Titan One';font-size:30px}
.pod .rk{font-family:'Titan One';font-size:44px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(2,10,24,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal .panel{max-width:460px;background:#0c3157}

/* ---------- PLAYER (phone) ---------- */
.phone{min-height:100vh;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 16px 20px;gap:14px}
.ph-top{display:flex;justify-content:space-between;align-items:center}
.ph-top .me{font-weight:900;font-size:18px}
.ph-top .me small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.ph-score{font-family:'Titan One';font-size:28px;color:var(--gold)}
.ph-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.ph-big{font-family:'Titan One';font-size:34px;line-height:1.1}
.ph-sub{color:var(--muted);font-weight:800;font-size:16px;line-height:1.4}
.ph-clue{font-weight:900;font-size:18px;line-height:1.35;background:rgba(0,0,0,.22);padding:14px;border-radius:14px;text-align:left}
.ph-opts{display:grid;gap:10px}
.ph-opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;font-weight:900;font-size:19px;color:var(--ink);text-align:left;min-height:68px}
.ph-opt .L{font-family:'Titan One';font-size:24px;width:40px;height:40px;flex:none;border-radius:10px;background:rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center}
.ph-opt:active{transform:scale(.98)}
.ph-names{display:grid;gap:10px}
.ph-name{background:var(--sponge);color:var(--ink);font-weight:900;font-size:24px;padding:18px;border-radius:16px;box-shadow:0 5px 0 #b8960b}
.ph-name:nth-child(3n+2){background:var(--pink);box-shadow:0 5px 0 #c2557a}
.ph-name:nth-child(3n){background:var(--teal);box-shadow:0 5px 0 #1f8f8b}
.ph-result{font-family:'Titan One';font-size:46px}
.ph-result.right{color:var(--good)}.ph-result.wrong{color:var(--bad)}
.ph-wager{font-size:34px;font-weight:900;text-align:center;padding:14px;border-radius:16px;border:0;width:100%;color:var(--ink)}
.ph-timer{height:10px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
.ph-timer i{display:block;height:100%;background:linear-gradient(90deg,var(--good),var(--sponge),var(--coral))}
.link{background:none;color:var(--muted);text-decoration:underline;font-weight:800;font-size:14px}
.ph-lock{font-family:'Titan One';font-size:64px;width:120px;height:120px;border-radius:30px;margin:0 auto;display:flex;align-items:center;justify-content:center;color:var(--ink)}

@media (max-width:900px){
  .lobby{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .board{min-height:420px}
  .top{padding:12px 14px}.boardwrap{padding:0 10px 12px}
  .logo .a,.logo .b{font-size:22px}
}
</style>
</head>
<body>
<div id="bubbles"></div><div class="sand"></div>
<div id="app"><div class="cluescreen"><div class="ph-sub">Diving in…</div></div></div>

<script>
/* ================= CONFIG ================= */
const JOIN_PARAM = (new URLSearchParams(location.search).get('join')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
const PEER_PREFIX = 'bbjeopardy-';
const VALUES = [200,400,600,800,1000];
const LET = ['A','B','C','D'];
const STORE_HOST = 'bbj-host-v3', STORE_ME = 'bbj-me-v1';

/* ================= TRIVIA ================= */
// a = index of the correct option (options get shuffled each new game)
const DATA = {
  cats: [
    { name: "Bikini Bottom Locals", clues: [
      { q: "Squidward's house is shaped like what?", o: ["An Easter Island head","A tiki totem","A diving helmet","A lighthouse"], a: 0 },

    { name: "Krusty Krab Kitchen", clues: [

      { q: "In 'Pickles,' where was the customer hiding the pickles SpongeBob supposedly forgot?", o: ["Under his tongue","Under the bun","In his pocket","Stuck to his tray"], a: 0 },
      { q: "In the 'Krusty Krab Training Video,' what does P.O.O.P. stand for?", o: ["People Order Our Patties","Please Order Our Patties","Put Onions On Patties","Patties Only, Order Promptly"], a: 0 },
      { q: "In 'The Fry Cook Games,' which restaurant does Patrick compete for?", o: ["The Chum Bucket","The Krusty Krab","Weenie Hut Jr's","Fancy!"], a: 0 }

    { name: "Famous Episodes", clues: [
      { q: "In 'Ripped Pants,' where does SpongeBob first rip his pants?", o: ["Goo Lagoon","Jellyfish Fields","Glove World","Rock Bottom"], a: 0 },
      { q: "In 'Graveyard Shift,' which spooky legend does Squidward tell SpongeBob?", o: ["The Hash-Slinging Slasher","The Spatula Phantom","The Headless Fry Cook","The Grill Ghoul"], a: 0 },

    { name: "Behind the Voice", clues: [

      { q: "Who is the voice of Mr. Krabs?", o: ["Clancy Brown","Ron Perlman","Mark Hamill","Rodger Bumpass"], a: 0 },
      { q: "Besides SpongeBob, Tom Kenny also voices which character?", o: ["Gary","Plankton","Larry the Lobster","Squidward"], a: 0 },
      { q: "Who is the voice of Plankton?", o: ["Mr. Lawrence","Dee Bradley Baker","Carlos Alazraqui","Jeff Bennett"], a: 0 },
      { q: "Which Hollywood legend voiced Mermaid Man?", o: ["Ernest Borgnine","Tim Conway","Adam West","Burgess Meredith"], a: 0 }
    ]},
    { name: "Behind the Bubbles", clues: [
      { q: "The show's French narrator is a nod to which famous ocean explorer?", o: ["Jacques Cousteau","Jacques Piccard","Robert Ballard","Philippe Tailliez"], a: 0 },
      { q: "Which episode aired first when the show premiered in 1999?", o: ["Help Wanted","Reef Blower","Tea at the Treedome","Bubblestand"], a: 0 },
      { q: "In 'Help Wanted,' what swarms the Krusty Krab?", o: ["Anchovies","Sardines","Jellyfish","Piranhas"], a: 0 },
      { q: "Before SpongeBob, creator Stephen Hillenburg made an educational comic starring 'Bob the Sponge.' What was it called?", o: ["The Intertidal Zone","Tide Pool Tales","The Reef Report","Life in the Shallows"], a: 0 },
      { q: "In 'Help Wanted,' whose falsetto ukulele recording plays while SpongeBob feeds the anchovies?", o: ["Tiny Tim","Don Ho","Wayne Newton","Rudy Vallee"], a: 0 }
    ]},
    { name: "Deep Sea Deep Cuts", clues: [
      { q: "What is Squidward's last name?", o: ["Tentacles","Inkwell","Suckerton","Squidly"], a: 0 },
      { q: "In 'Squidville,' what is the name of the gated community Squidward moves to?", o: ["Tentacle Acres","Squid Estates","Inkwood Heights","Calamari Commons"], a: 0 },

function probe(url){return new Promise(res=>{const im=new Image();im.onload=()=>res(true);im.onerror=()=>res(false);im.src=url})}
async function loadRepoPics(){

const REPO_PICS={};
function shrink(file){return new Promise(res=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const sc=Math.min(1,1600/img.width);const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b||file),'image/jpeg',.88)};img.onerror=()=>{URL.revokeObjectURL(u);res(null)};img.src=u})}
async function savePic(id,file){if(!file||!/^image\//.test(file.type))return;const blob=await shrink(file);if(!blob)return;
  if(picDB){try{picDB.transaction('pics','readwrite').objectStore('pics').put(blob,id)}catch(e){}}
  if(PICS[id]&&PICS[id].startsWith('blob:'))URL.revokeObjectURL(PICS[id]);delete REPO_PICS[id];PICS[id]=URL.createObjectURL(blob);render()}

const stemOf=n=>String(n).split('/').pop().replace(/\.[^.]+$/,'').toLowerCase();
async function bulkImport(files){
  let ok=0,skip=[];importMsg='Importing…';render();
  for(const f of files){
    if(/\.zip$/i.test(f.name)){
      try{const JSZip=await loadJSZip();const z=await JSZip.loadAsync(f);
        for(const e of Object.values(z.files)){if(e.dir||/__MACOSX|\/\./.test(e.name))continue;
          const id=stemOf(e.name);if(!/\.(jpe?g|png|webp|gif)$/i.test(e.name)){continue}
          if(!picById(id)){skip.push(e.name.split('/').pop());continue}
          const blob=await e.async('blob');const ext=e.name.split('.').pop().toLowerCase();
          await savePic(id,new File([blob],e.name,{type:'image/'+(ext==='jpg'?'jpeg':ext)}));ok++}
      }catch(err){skip.push(f.name+' (could not open zip)')}
    } else if(f.type&&f.type.startsWith('image/')){
      const id=stemOf(f.name);if(picById(id)){await savePic(id,f);ok++}else skip.push(f.name);
    }
  }
  importMsg=`Imported ${ok} picture${ok===1?'':'s'}`+(skip.length?` · didn't match a card: ${skip.slice(0,6).join(', ')}${skip.length>6?'…':''}`:'');render();
}

function newGame(players){
  const opts={};
  DATA.cats.forEach((c,ci)=>c.clues.forEach((cl,ri)=>{const id=ci+'-'+ri;const order=shuffle([0,1,2,3]);opts[id]={o:order.map(i=>cl.o[i]),a:order.indexOf(cl.a)}}));

      endsAt:0, wagers:{}, fanswers:{}, fres:{}, picCol:[], code: prev.code || genCode(), base: prev.base || '' };

function save(){lsSet(STORE_HOST,G)}
const PIC_CAT='Picture This';
const hasPicCol=()=>!!(G&&G.picCol&&G.picCol.some(Boolean));
function totalClues(){return DATA.cats.length*5+((G&&G.picCol)||[]).filter(Boolean).length}
function clueOf(id){
  if(id.startsWith('p-')){const r=+id.slice(2);const P=picById(G.picCol[r]);return {cat:PIC_CAT,v:VALUES[r],q:PIC_Q[P.t],img:PICS[P.id]||'missing',zoom:1+0.5*(r+1),...G.opts[id]}}
  const [c,r]=id.split('-').map(Number);const cl=DATA.cats[c].clues[r];return {cat:DATA.cats[c].name,v:VALUES[r],q:cl.q,...G.opts[id]}}
function assignPics(){
  const have=PIC_POOL.filter(p=>PICS[p.id]);G.picCol=[];if(!have.length){save();return}
  const used=new Set();
  for(let r=0;r<5;r++){
    const pick=d=>shuffle(have.filter(p=>p.d===d&&!used.has(p.id)))[0];
    let P=pick(r+1);for(let k=1;!P&&k<5;k++)P=pick(r+1+k)||pick(r+1-k);
    if(!P){G.picCol.push(null);continue}
    used.add(P.id);G.picCol.push(P.id);
    const same=PIC_POOL.filter(x=>x.t===P.t&&x.id!==P.id);
    const near=shuffle(same.filter(x=>Math.abs(x.d-P.d)<=1));const far=shuffle(same.filter(x=>Math.abs(x.d-P.d)>1));
    const dis=[...near,...far].slice(0,3).map(x=>x.n);
    const o=shuffle([P.n,...dis]);G.opts['p-'+r]={o,a:o.indexOf(P.n)};
  }
  save();
}
function picScale(){const C=G.current&&clueOf(G.current);if(!C||!C.img||C.img==='missing')return 1;if(G.phase!=='clue')return 1;return 1+(C.zoom-1)*(timeLeft()/(G.timer*1000))}
function scores(){
  const s={};G.players.forEach(p=>s[p]=0);
  Object.values(G.results).forEach(R=>{G.players.forEach(p=>{if(R.r[p]==='right')s[p]+=R.v;else if(R.r[p]==='wrong'&&G.minus)s[p]-=R.v})});
  G.players.forEach(p=>{const w=+G.wagers[p]||0;if(G.fres[p]==='right')s[p]+=w;else if(G.fres[p]==='wrong')s[p]-=w});
  return s;
}
function preFinalScores(){const keep=G.fres;G.fres={};const s=scores();G.fres=keep;return s}
function maxWager(p){return Math.max(preFinalScores()[p]||0,1000)}
function timeLeft(){return Math.max(0,G.endsAt-Date.now())}

function setPhase(ph){G.phase=ph;save();render();publish()}

function openClue(id){
  if(G.used[id])return;

function startClueTimer(){G.endsAt=Date.now()+G.timer*1000;sfx.open();setPhase('clue')}
function addTime(){G.endsAt=Math.max(G.endsAt,Date.now())+10000;save();render();publish()}
function reveal(){
  const id=G.current, C=clueOf(id), v=C.v*(id===G.dd?2:1), r={};
  G.players.forEach(p=>{const a=G.answers[p];r[p]=(a==null)?'':(a===C.a?'right':'wrong')});
  G.results[id]={v,r,ch:{...G.answers}};G.used[id]=true;G.endsAt=0;
  sfx.win();setPhase('reveal');
}
function cycle(p){const R=G.results[G.current];if(!R)return;R.r[p]=R.r[p]===''?'right':R.r[p]==='right'?'wrong':'';save();render();publish()}
function cycleFinal(p){G.fres[p]=!G.fres[p]?'right':G.fres[p]==='right'?'wrong':'';save();render();publish()}
function backToBoard(){G.current=null;G.answers={};setPhase(Object.keys(G.used).length>=totalClues()?'board':'board')}
function startFinal(){G.key='f'+Date.now().toString(36);G.wagers={};G.fanswers={};G.fres={};G.answers={};sfx.dd();setPhase('finalWager')}

// ---- host networking ----
let peer=null; const conns=new Map(); // conn -> player name
function hostNet(){
  if(!window.Peer){netOK=false;netMsg='Live link failed to load (check internet)';render();return}
  if(!G.code){G.code=genCode();save()}
  try{if(peer)peer.destroy()}catch(e){}
  netMsg='Connecting…';
  peer=new Peer(PEER_PREFIX+G.code.toLowerCase(),ICE);
  peer.on('open',()=>{netOK=true;netMsg='Live';render()});
  peer.on('connection',c=>{
    conns.set(c,null);
    c.on('open',()=>{try{c.send({t:'state',s:publicState()})}catch(e){}});
    c.on('data',d=>onPhoneMsg(c,d));
    c.on('close',()=>{conns.delete(c);recomputePhones()});
    c.on('error',()=>{conns.delete(c);recomputePhones()});
  });
  peer.on('disconnected',()=>{netOK=false;netMsg='Reconnecting…';render();setTimeout(()=>{try{peer.reconnect()}catch(e){}},1500)});
  peer.on('error',e=>{
    netOK=false;
    if(e.type==='unavailable-id'){netMsg='Code busy, retrying… (or tap New code)';render();setTimeout(hostNet,4000);return}
    if(e.type==='browser-incompatible'){netMsg='This browser cannot host phones';render();return}
    if(['network','server-error','socket-error','socket-closed'].includes(e.type)){netMsg='Reconnecting…';render();setTimeout(hostNet,3000)}
  });
}
function newCode(){G.code=genCode();save();for(const c of conns.keys()){try{c.close()}catch(e){}}conns.clear();recomputePhones();hostNet()}
function recomputePhones(){const ph={};let n=0;for(const nm of conns.values()){n++;if(nm&&G.players.includes(nm))ph[nm]=true}
  const ch=JSON.stringify(ph)!==JSON.stringify(phones)||n!==peerCount;phones=ph;peerCount=n;if(ch)render()}
function onPhoneMsg(c,d){
  if(!d||typeof d!=='object')return;
  const name=clean(d.name);
  if(name&&G.players.includes(name)&&conns.get(c)!==name){conns.set(c,name);recomputePhones()}
  if(!name||!G.players.includes(name)){ if(d.t==='hello'){conns.set(c,null);recomputePhones()} try{c.send({t:'state',s:publicState()})}catch(e){} return}
  const now=Date.now();let changed=false;
  if(d.t==='ans'&&d.k===G.key&&(G.phase==='clue'||G.phase==='finalClue')&&G.answers[name]==null&&now<=G.endsAt+800){
    const v=Number(d.c);if(v>=0&&v<=3){G.answers[name]=v;changed=true;sfx.lock()}
  }
  if(d.t==='wg'&&d.k===G.key&&G.phase==='finalWager'){
    const v=Math.max(0,Math.min(Math.floor(Number(d.v)||0),maxWager(name)));
    if(G.wagers[name]!==v){G.wagers[name]=v;changed=true}
  }
  if(changed){save();
    if((G.phase==='clue'||G.phase==='finalClue')&&G.players.every(p=>G.answers[p]!=null)){G.phase==='clue'?reveal():revealFinal();return}
    render();
  }
  publish();
}
function joinUrl(){
  const base=(G.base&&G.base.trim())||location.href.split(/[?#]/)[0];
  return base+'?join='+(G.code||'');

function publicState(){
  const s=scores();
  const st={ph:G.phase==='pics'?'lobby':G.phase,pl:G.players,sc:s,k:G.key,ans:Object.keys(G.answers),end:timeLeft(),tot:G.phase==='finalClue'?30000:G.timer*1000,t:Date.now()};
  if(G.phase==='dd'){const C=clueOf(G.current);st.c={cat:C.cat,v:C.v*2,dd:1}}
  if(G.phase==='clue'||G.phase==='reveal'){const C=clueOf(G.current);st.c={cat:C.cat,v:C.v*(G.current===G.dd?2:1),q:C.q,o:C.o,dd:G.current===G.dd?1:0,pic:C.img?1:0}}
  if(G.phase==='reveal'){const R=G.results[G.current];st.rv={a:clueOf(G.current).a,r:R.r}}
  if(G.phase==='finalWager'){st.fc=DATA.final.cat;st.max={};G.players.forEach(p=>st.max[p]=maxWager(p));st.fw=G.wagers}
  if(G.phase==='finalClue'||G.phase==='finalReveal'){st.c={cat:DATA.final.cat,v:0,q:DATA.final.q,o:G.fopts.o}}
  if(G.phase==='finalReveal'||G.phase==='over'){st.rv={a:G.fopts.a,r:G.fres};st.fw=G.wagers}
  return st;
}

function syncNames(){
  const inputs=[...document.querySelectorAll('[data-pl]')];if(!inputs.length)return;
  const old=G.players.slice();
  const names=inputs.map((inp,i)=>clean(inp.value)||('Player '+(i+1)));
  // dedupe
  const seen={};const fixed=names.map(n=>{let m=n,k=2;while(seen[m])m=n+' '+(k++);seen[m]=1;return m});
  // carry results across renames
  old.forEach((o,i)=>{const n=fixed[i];if(n&&n!==o){Object.values(G.results).forEach(R=>{if(o in R.r){R.r[n]=R.r[o];delete R.r[o]}if(R.ch&&o in R.ch){R.ch[n]=R.ch[o];delete R.ch[o]}})}});
  G.players=fixed;save();
}

document.addEventListener('click',e=>{
  if(MODE!=='host')return;
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.clue){openClue(t.dataset.clue);return}
  if(t.dataset.cyc!=null){G.phase==='finalReveal'?cycleFinal(t.dataset.cyc):cycle(t.dataset.cyc);return}
  if(t.dataset.timer){syncNames();G.timer=+t.dataset.timer;save();render();return}
  if(t.dataset.minus){syncNames();G.minus=t.dataset.minus==='1';save();render();return}
  if(t.dataset.sound){syncNames();G.sound=t.dataset.sound==='1';save();render();return}
  if(t.dataset.rm!=null){syncNames();if(G.players.length>1){G.players.splice(+t.dataset.rm,1);save()}render();publish();return}
  const a=t.dataset.act;if(!a)return;
  if(a==='addpl'){syncNames();if(G.players.length<8){G.players.push('Player '+(G.players.length+1));save()}render();publish();return}
  if(a==='start'){syncNames();if(!Object.keys(G.used).length)assignPics();setPhase('board');return}
  if(a==='pics'){syncNames();setPhase('pics');return}
  if(a==='picsdone'){importMsg='';setPhase('lobby');return}
  if(a==='bulk'){const i=$('#bulkin');if(i)i.click();return}
  if(a==='picrm'){removePic(t.dataset.id);return}
  if(a==='picup'){picSel=t.dataset.id;const inp=document.getElementById('pf-'+t.dataset.id);if(inp)inp.click();return}
  if(a==='picf'){picFilter=t.dataset.f;render();return}
  if(a==='picsel'){picSel=t.dataset.id;render();return}
  if(a==='reset'){syncNames();openModal('Start a new game?','Scores and the board reset. Player names stay.',()=>{newGame(G.players);render();publish()});return}
  if(a==='lobby'){setPhase('lobby');return}
  if(a==='newcode'){syncNames();newCode();return}
  if(a==='setbase'){syncNames();G.base=($('#baseurl').value||'').trim();save();render();return}
  if(a==='board'){syncNames();backToBoard();return}
  if(a==='final'){const left=totalClues()-Object.keys(G.used).length;if(left>0)openModal('Jump to Final Jeopardy?',`${left} clue${left===1?' is':'s are'} still on the board.`,startFinal);else startFinal();return}
  if(a==='ddgo'){startClueTimer();return}
  if(a==='reveal'){reveal();return}
  if(a==='revealfinal'){revealFinal();return}
  if(a==='addtime'){addTime();return}
  if(a==='finalclue'){showFinalClue();return}
  if(a==='over'){setPhase('over');return}
  if(a==='again'){newGame(G.players);setPhase('lobby');return}
});

  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="panel"><h2>${esc(title)}</h2><p>${esc(body)}</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-m="no">Cancel</button><button class="btn" data-m="yes">Yes</button></div></div>`;
  m.addEventListener('click',ev=>{const b=ev.target.closest('[data-m]');if(ev.target===m||b){m.remove();if(b&&b.dataset.m==='yes')yes()}ev.stopPropagation()});
  document.body.appendChild(m);
}

/* ======================================================================
   PLAYER (phone)
   ====================================================================== */
let H=null, Hrecv=0, hostPeer=null, me=lsGet(STORE_ME), myAns={}, myWager={};
function hostEnd(){if(!H)return 0;return Math.max(0,H.end-(Date.now()-Hrecv))}
let ppeer=null,pconn=null,joinCode=JOIN_PARAM||lsGet('bbj-code')||'',pTried=false;
function playerNet(){
  if(!joinCode){prender();return}
  if(!window.Peer){netMsg='Live link failed to load. Check your connection and refresh.';prender();return}
  if(ppeer&&!ppeer.destroyed){connectHost();return}
  ppeer=new Peer(ICE);
  ppeer.on('open',connectHost);
  ppeer.on('disconnected',()=>{setTimeout(()=>{try{ppeer.reconnect()}catch(e){}},1500)});
  ppeer.on('error',e=>{
    if(e.type==='peer-unavailable'){netOK=false;H=null;netMsg='Can\'t find game '+joinCode+'. Is the big screen open?';prender();setTimeout(connectHost,3000);return}
    if(['network','server-error','socket-error','socket-closed'].includes(e.type)){netOK=false;netMsg='Reconnecting…';prender();setTimeout(()=>{try{ppeer.destroy()}catch(_){}ppeer=null;playerNet()},3000)}
  });
}
function connectHost(){
  if(!ppeer||ppeer.destroyed||ppeer.disconnected)return;
  if(pconn&&pconn.open)return;
  try{if(pconn)pconn.close()}catch(e){}
  const c=ppeer.connect(PEER_PREFIX+joinCode.toLowerCase(),{reliable:true});pconn=c;
  c.on('open',()=>{netOK=true;lsSet('bbj-code',joinCode);sendMine();prender()});
  c.on('data',d=>{if(d&&d.t==='state'&&d.s)onHostState(d.s)});
  c.on('close',()=>{if(pconn!==c)return;netOK=false;H=null;netMsg='Lost the big screen, reconnecting…';prender();setTimeout(connectHost,2000)});
  c.on('error',()=>{});
}
function onHostState(st){
  const prevK=H&&H.k;H=st;Hrecv=Date.now();
  if(prevK!==H.k&&(H.ph==='clue'||H.ph==='finalClue')){try{navigator.vibrate&&navigator.vibrate(80)}catch(e){}}
  prender();
}
function sendMine(){
  if(!pconn||!pconn.open)return;
  try{
    pconn.send({t:'hello',name:me||''});
    if(H&&me&&myAns[H.k]!=null)pconn.send({t:'ans',name:me,k:H.k,c:myAns[H.k]});
    if(H&&me&&myWager[H.k]!=null)pconn.send({t:'wg',name:me,k:H.k,v:myWager[H.k]});
  }catch(e){}
}
const pushPresence=sendMine;
// resend anything the host hasn't acknowledged yet
setInterval(()=>{if(MODE!=='player'||!H||!me)return;
  const needAns=myAns[H.k]!=null&&!(H.ans||[]).includes(me);
  const needWg=H.ph==='finalWager'&&myWager[H.k]!=null&&(H.fw||{})[me]!==myWager[H.k];
  if(needAns||needWg)sendMine()},1500);

function prender(){
  if(MODE!=='player')return;const app=$('#app');
  const top=(sc)=>`<div class="ph-top"><div class="me">${me?esc(me):'Bikini Bottom'}<small>${me?'<button class="link" data-p="switch">not you?</button>':'Jeopardy'}</small></div>${sc!=null?`<div class="ph-score">${money(sc)}</div>`:''}</div>`;
  if(!joinCode){app.innerHTML=`<div class="phone">${top()}<div class="ph-body"><div style="font-size:60px">🍍</div><div class="ph-big">Enter game code</div><div class="ph-sub">It's on the big screen.</div>
      <input class="ph-wager" id="codein" maxlength="6" autocapitalize="characters" autocomplete="off" placeholder="ABCDE" style="text-transform:uppercase;letter-spacing:6px">
      <button class="btn big" data-p="code">Join</button></div></div>`;return}
  if(!H){app.innerHTML=`<div class="phone">${top()}<div class="ph-body"><div style="font-size:60px">🍍</div><div class="ph-big">${netOK?'Connected!':'Finding game '+esc(joinCode)+'…'}</div><div class="ph-sub">${esc(netOK?'Waiting for the big screen.':netMsg)}</div>
      <button class="link" data-p="recode">Different code?</button></div></div>`;return}
  if(!me||!H.pl.includes(me)){
    app.innerHTML=`<div class="phone">${top()}<div class="ph-body"><div class="ph-big">Who are you?</div><div class="ph-sub">Tap your name to join.</div>
      <div class="ph-names">${H.pl.map(p=>`<button class="ph-name" data-name="${esc(p)}">${esc(p)}</button>`).join('')}</div></div></div>`;return}
  const sc=H.sc[me]??0;
  const rank=H.pl.slice().sort((a,b)=>(H.sc[b]||0)-(H.sc[a]||0)).indexOf(me)+1;
  const ord=n=>n+(['th','st','nd','rd'][(n%100>10&&n%100<14)?0:(n%10<4?n%10:0)]||'th');
  const ph=H.ph;let body='';
  if(ph==='lobby'||ph==='board'){
    body=`<div style="font-size:64px">${ph==='lobby'?'🫧':'🍔'}</div><div class="ph-big">${ph==='lobby'?"You're in!":'Eyes on the board'}</div>
      <div class="ph-sub">${ph==='lobby'?'Waiting for the host to start.':'Next clue coming up.'}<br>You're in ${ord(rank)} place.</div>`;
  } else if(ph==='dd'){
    body=`<div class="dd" style="font-size:56px">DAILY<br>DOUBLE!</div><div class="ph-sub">${esc(H.c.cat)} · worth ${money(H.c.v)}</div>`;
  } else if(ph==='clue'||ph==='finalClue'){
    const mine=myAns[H.k];const acked=H.ans.includes(me);const ms=hostEnd();
    if(mine!=null||acked){const c=mine;
      body=`<div class="ph-lock o${c??0}">${c!=null?LET[c]:'✓'}</div><div class="ph-big">Locked in!</div><div class="ph-sub">${acked?'The big screen has your answer.':'Sending…'}</div>`;
    } else if(ms<=0){
      body=`<div style="font-size:64px">⏰</div><div class="ph-big">Time's up!</div>`;
    } else {
      body=`<div class="ph-timer"><i id="ptbar" style="width:100%"></i></div>
        <div class="ph-sub" style="text-align:left">${esc(H.c.cat)}${H.c.v?' · '+money(H.c.v):''}</div>
        <div class="ph-clue">${H.c.pic?'👀 ':''}${esc(H.c.q)}${H.c.pic?'<br><span style="color:var(--sponge);font-size:15px">Look at the big screen! The picture zooms out as time runs down.</span>':''}</div>
        <div class="ph-opts">${H.c.o.map((o,i)=>`<button class="ph-opt o${i}" data-ans="${i}"><span class="L">${LET[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
    }
  } else if(ph==='reveal'||ph==='finalReveal'){
    const r=(H.rv&&H.rv.r||{})[me]||'';const ans=H.c&&H.c.o?H.c.o[H.rv.a]:'';
    const delta=ph==='finalReveal'?(+((H.fw||{})[me])||0):(H.c.v||0);
    body=`<div class="ph-result ${r}">${r==='right'?'Correct!':r==='wrong'?'Nope!':'No answer'}</div>
      ${r==='right'?`<div class="ph-big" style="color:var(--gold)">+${money(delta)}</div>`:''}
      <div class="ph-sub">The answer was<br><b style="color:var(--white);font-size:20px">${LET[H.rv.a]}. ${esc(ans)}</b></div>
      <div class="ph-sub">You're in ${ord(rank)} place.</div>`;
  } else if(ph==='finalWager'){
    const max=(H.max||{})[me]||1000;const locked=(H.fw||{})[me];
    body=`<div class="ph-sub">FINAL JEOPARDY</div><div class="ph-big">${esc(H.fc)}</div>
      <div class="ph-sub">You have ${money(sc)}. Wager up to ${money(max)}.</div>
      <input class="ph-wager" id="wg" type="number" inputmode="numeric" min="0" max="${max}" placeholder="0" value="${myWager[H.k]??''}">
      <button class="btn big" data-p="wager">${locked!=null?'Update wager':'Lock in wager'}</button>
      ${locked!=null?`<div class="ph-sub" style="color:var(--good)">Locked in: ${money(locked)}</div>`:''}`;
  } else if(ph==='over'){
    body=`<div style="font-size:70px">${rank===1?'🏆':rank===2?'🥈':rank===3?'🥉':'🫧'}</div><div class="ph-big">${rank===1?'You win!':ord(rank)+' place'}</div><div class="ph-sub">Final score ${money(sc)}</div>`;
  }
  app.innerHTML=`<div class="phone">${top(sc)}<div class="ph-body">${body}</div></div>`;
}
setInterval(()=>{if(MODE!=='player'||!H)return;if(H.ph==='clue'||H.ph==='finalClue'){const b=$('#ptbar');const ms=hostEnd();const total=H.tot||20000;
  if(b)b.style.width=Math.min(100,100*ms/Math.max(total,1))+'%';if(ms<=0&&b)prender()}},250);
document.addEventListener('click',e=>{
  if(MODE!=='player')return;const t=e.target.closest('button');if(!t)return;
  if(t.dataset.name){me=t.dataset.name;lsSet(STORE_ME,me);pushPresence();prender();return}
  if(t.dataset.ans!=null&&H){myAns[H.k]=+t.dataset.ans;try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}pushPresence();prender();return}
  if(t.dataset.p==='code'){const v=($('#codein').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);if(v.length>=4){joinCode=v;netMsg='Connecting…';prender();playerNet()}return}
  if(t.dataset.p==='recode'){joinCode='';lsSet('bbj-code','');H=null;netOK=false;try{pconn&&pconn.close()}catch(e){}pconn=null;prender();return}
  if(t.dataset.p==='switch'){me=null;lsSet(STORE_ME,null);pushPresence();prender();return}
  if(t.dataset.p==='wager'&&H){const v=Math.max(0,Math.min(parseInt($('#wg').value,10)||0,(H.max||{})[me]||1000));myWager[H.k]=v;pushPresence();prender();return}
});

/* ================= BOOT ================= */
let MODE=null;
function boot(){
  MODE=(JOIN_PARAM||location.hash==='#play')?'player':'host';
  if(MODE==='host'){
    G=lsGet(STORE_HOST);
    if(!G||!G.opts||!G.players){G=null;newGame()}
    if(!G.code){G.code=genCode();save()}
    if(G.phase==='pics')G.phase='lobby';
    if(G.phase==='clue'||G.phase==='finalClue'){if(timeLeft()<=0)G.endsAt=Date.now()+5000}
    render();hostNet();setInterval(publish,4000);
    loadPics().then(loadRepoPics).then(()=>render());
  } else {prender();playerNet()}
}
window.addEventListener('hashchange',()=>location.reload());
boot();
</script>
</body>
